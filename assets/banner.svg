<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#90e0ef"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b132b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <style>
      @keyframes flightPath {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseRadar {
        0% { r: 10px; opacity: 0.8; }
        100% { r: 90px; opacity: 0; }
      }
      @keyframes floatPlane {
        0% { transform: translate(0px, 0px); }
        50% { transform: translate(4px, -6px); }
        100% { transform: translate(0px, 0px); }
      }
      .flight-line {
        stroke: #00b4d8;
        stroke-dasharray: 12 8;
        animation: flightPath 12s linear infinite;
      }
      .radar-pulse {
        animation: pulseRadar 3s ease-out infinite;
      }
      .plane-icon {
        animation: floatPlane 4s ease-in-out infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #90e0ef;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="url(#bg-grad)"/>
  <circle cx="780" cy="120" r="160" fill="url(#glow)"/>

  <!-- Radar background graphics -->
  <g stroke="#ffffff" stroke-opacity="0.08" fill="none">
    <circle cx="780" cy="120" r="40"/>
    <circle cx="780" cy="120" r="80"/>
    <circle cx="780" cy="120" r="120"/>
    <line x1="780" y1="0" x2="780" y2="240"/>
    <line x1="660" y1="120" x2="900" y2="120"/>
  </g>

  <!-- Dynamic Radar Pulse -->
  <circle cx="780" cy="120" r="10" fill="none" stroke="#00b4d8" stroke-width="2" class="radar-pulse"/>

  <!-- Animated Flight Paths -->
  <path d="M -20 180 Q 250 80 500 130 T 920 60" fill="none" stroke="#00b4d8" stroke-width="2.5" class="flight-line" opacity="0.7"/>
  <path d="M -20 200 Q 350 220 650 100 T 920 140" fill="none" stroke="#90e0ef" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Foreground Content Container with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Header Pill / Tag -->
    <rect x="50" y="36" width="220" height="26" rx="13" fill="#0077b6" fill-opacity="0.6" stroke="#00b4d8" stroke-width="1"/>
    <text x="62" y="53" class="badge-text">✈️ AVIATION ECOSYSTEM &amp; OCC</text>

    <!-- Main Title -->
    <text x="50" y="105" font-size="32" class="title-text">Awesome Airline Operations</text>
    <text x="50" y="142" font-size="32" class="title-text" fill="url(#accent-grad)">Management 🚀</text>

    <!-- Subtitle -->
    <text x="50" y="180" font-size="14" class="subtitle-text">Curated SaaS Platforms, OCC Systems, Crew Planning &amp; Open-Source Aviation Tools</text>
  </g>

  <!-- Decorative Airplane Icon -->
  <g class="plane-icon" transform="translate(740, 95)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#90e0ef" transform="scale(1.8) rotate(45)"/>
  </g>
</svg>
